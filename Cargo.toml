[package]
name = "hostv1"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
diesel = { version ="2.3.13", features=["postgres", "chrono"] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
dotenvy = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
