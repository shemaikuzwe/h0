<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>h0 console</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-attach@0.11.0/lib/addon-attach.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #term { height: 100%; }
  </style>
</head>
<body>
  <div id="term"></div>
  <script>
    const term = new Terminal({ cursorBlink: true });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term'));
    fit.fit();
    window.addEventListener('resize', () => fit.fit());

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';
    term.loadAddon(new AttachAddon.AttachAddon(ws));
    ws.onclose = () => term.write('\r\n[console closed]\r\n');
  </script>
</body>
</html>
